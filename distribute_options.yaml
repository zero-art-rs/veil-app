output: dist/
releases:
  - name: veil-macos
    jobs:
      - name: build-macos-app
        package:
          platform: macos
          target: dmg
  - name: veil-windows
    jobs:
      - name: build-windows-app
        package:
          platform: windows
          target: exe
  - name: veil-linux
    jobs:
      - name: build-linux-app
        package:
          platform: linux
          target: deb
