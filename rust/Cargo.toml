[package]
name = "rust_lib_zk_notion_app"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
uuid = { version = "1.17.0", features = ["v7", "serde"] }
flutter_rust_bridge = "=2.11.1"
automerge = { version = "0.6.1", features = ["optree-visualisation"]}
anyhow = "1.0.99"
sha2 = "0.10.9"
awesome-client-sdk = { git = "ssh://git@github.com/zk-messenger/awesome-client-sdk.git", branch = "refactoring" }
zk = { git = "ssh://git@github.com/zk-messenger/project-m.git" }
art = { git = "ssh://git@github.com/zk-messenger/project-m.git" }
crypto = { git = "ssh://git@github.com/zk-messenger/project-m.git" }
cortado = { git = "ssh://git@github.com/zk-messenger/project-m.git" }
bulletproofs = { version = "5.0.0", git="https://github.com/zk-messenger/bulletproofs"}
ark-serialize = { version = "0.5.0", git = "https://github.com/arkworks-rs/algebra", rev = "7601bf9" }
prost = "0.14.1"
prost-types = "0.14.1"
ark-ec = { version = "0.5.0", git = "https://github.com/arkworks-rs/algebra", rev = "7601bf9" }
chrono = "0.4.42"
sha3 = "0.10.8"
base64 = "0.22.1"
graphviz-rust = "0.9.6"
hex = "0.4.3"

[patch.crates-io]
aead = { path = "./patches/aead-0.5.2-fixed" }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
